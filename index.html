<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prode Mojarrero ⚽</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000000;
      color: #e5e5e5;
      font-family: system-ui, -apple-system, sans-serif;
      padding-bottom: 80px;
    }
    header {
      background-color: #0a0a0a;
      border-bottom: 1px solid rgba(57, 255, 20, 0.3);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .neon-title {
      color: #39FF14;
      font-weight: 800;
      text-transform: uppercase;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }
    main {
      padding: 16px;
      max-width: 450px;
      margin: 0 auto;
    }
    .card {
      background-color: #111111;
      border: 1px solid rgba(57, 255, 20, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="password"], input[type="number"], select, input[type="datetime-local"] {
      width: 100%;
      background-color: #000;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    input:focus {
      border-color: #39FF14;
    }
    .btn-green {
      width: 100%;
      background-color: #39FF14;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      text-transform: uppercase;
      cursor: pointer;
    }
    .btn-green:active {
      background-color: #2ce00e;
    }
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #0a0a0a;
      border-top: 1px solid rgba(57, 255, 20, 0.3);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 50;
    }
    nav button {
      background: none;
      border: none;
      color: #888;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }
    nav button.active {
      color: #39FF14;
    }
    .hidden { display: none !important; }
    .error-msg {
      color: #ff4d4d;
      font-size: 0.8rem;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 1.5rem;">🐟</span>
      <h1 class="neon-title">Prode Mojarrero</h1>
    </div>
    <div id="userInfo" style="font-size: 0.75rem; color: #888;"></div>
  </header>

  <main>
    <!-- LOGIN SECCIÓN -->
    <div id="loginSection" class="card">
      <h2 style="color: #39FF14; text-align: center; margin-bottom: 16px;">Ingreso de Jugador</h2>
      
      <div class="form-group">
        <label>Nombre / Apodo</label>
        <input type="text" id="usernameInput" placeholder="Tu nombre">
      </div>

      <div class="form-group">
        <label>PIN (4 dígitos)</label>
        <input type="password" id="pinInput" maxlength="4" placeholder="••••">
      </div>

      <button id="btnLogin" type="button" class="btn-green">ENTRAR / REGISTRARSE</button>
      <div id="loginError" class="error-msg hidden"></div>
    </div>

    <!-- TAB PRONOSTICOS -->
    <div id="tab-pronosticos" class="hidden">
      <h2 style="color: #39FF14; margin-bottom: 12px; font-size: 1rem;">Tus Pronósticos</h2>
      <div id="matchesList"></div>
      <button type="button" onclick="guardarPronosticos()" class="btn-green" style="margin-top: 16px;">Guardar Pronósticos</button>
    </div>

    <!-- TAB POSICIONES -->
    <div id="tab-posiciones" class="hidden">
      <h2 style="color: #39FF14; margin-bottom: 12px; font-size: 1rem;">Tabla General</h2>
      <div class="card" style="margin-top:0; padding:0; overflow:hidden;">
        <table style="width:100%; border-collapse: collapse; font-size: 0.85rem; text-align: left;">
          <thead>
            <tr style="background:#000; color:#39FF14; border-bottom:1px solid #222;">
              <th style="padding:10px;">#</th>
              <th style="padding:10px;">Jugador</th>
              <th style="padding:10px; text-align:center;">Pts</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody"></tbody>
        </table>
      </div>
    </div>

    <!-- TAB EQUIPOS -->
    <div id="tab-equipos" class="hidden">
      <h2 style="color: #39FF14; margin-bottom: 12px; font-size: 1rem;">Planteles</h2>
      <div id="teamsList"></div>
    </div>

    <!-- TAB ADMIN -->
    <div id="tab-admin" class="hidden">
      <h2 style="color: #ff4d4d; margin-bottom: 12px; font-size: 1rem;">Administración</h2>
      <div id="adminAuth" class="card" style="margin-top:0;">
        <div class="form-group">
          <input type="password" id="adminPassInput" placeholder="Clave de Admin (admin123)">
        </div>
        <button type="button" onclick="checkAdmin()" class="btn-green" style="background:#ff4d4d; color:#fff;">Acceder</button>
      </div>

      <div id="adminPanel" class="hidden">
        <div class="card">
          <h3 style="color:#39FF14; font-size:0.9rem; margin-bottom:10px;">Crear Partido</h3>
          <div class="form-group">
            <input type="text" id="adminLocal" placeholder="Equipo Local" style="margin-bottom:8px;">
            <input type="text" id="adminVisitante" placeholder="Equipo Visitante">
          </div>
          <button type="button" onclick="crearPartido()" class="btn-green">Agregar Partido</button>
        </div>
      </div>
    </div>
  </main>

  <!-- NAVEGACIÓN INFERIOR -->
  <nav>
    <button id="nav-pronosticos" onclick="switchTab('pronosticos')" class="active">
      <span>⚽</span><span>Pronósticos</span>
    </button>
    <button id="nav-posiciones" onclick="switchTab('posiciones')">
      <span>🏆</span><span>Posiciones</span>
    </button>
    <button id="nav-equipos" onclick="switchTab('equipos')">
      <span>👕</span><span>Equipos</span>
    </button>
    <button id="nav-admin" onclick="switchTab('admin')">
      <span>⚙️</span><span>Admin</span>
    </button>
  </nav>

  <script>
    let state = {
      currentUser: localStorage.getItem('pm_user') || null,
      users: JSON.parse(localStorage.getItem('pm_users')) || {},
      matches: JSON.parse(localStorage.getItem('pm_matches')) || []
    };

    // Vincular evento directamente al cargar la página
    document.addEventListener('DOMContentLoaded', function() {
      const btn = document.getElementById('btnLogin');
      if (btn) {
        btn.addEventListener('click', handleLogin);
      }

      if (state.currentUser && state.users[state.currentUser]) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('userInfo').innerText = state.currentUser;
        switchTab('pronosticos');
      }
    });

    function handleLogin() {
      const name = document.getElementById('usernameInput').value.trim();
      const pin = document.getElementById('pinInput').value.trim();
      const err = document.getElementById('loginError');

      if (!name || pin.length !== 4) {
        err.innerText = "Ingresá un nombre y un PIN de 4 dígitos.";
        err.classList.remove('hidden');
        return;
      }

      if (state.users[name]) {
        if (state.users[name].pin !== pin) {
          err.innerText = "PIN incorrecto para este usuario.";
          err.classList.remove('hidden');
          return;
        }
      } else {
        state.users[name] = { pin: pin, pronosticos: {}, puntos: 0 };
      }

      state.currentUser = name;
      localStorage.setItem('pm_user', name);
      localStorage.setItem('pm_users', JSON.stringify(state.users));

      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('userInfo').innerText = name;
      switchTab('pronosticos');
    }

    function switchTab(tabId) {
      document.getElementById('tab-pronosticos').classList.add('hidden');
      document.getElementById('tab-posiciones').classList.add('hidden');
      document.getElementById('tab-equipos').classList.add('hidden');
      document.getElementById('tab-admin').classList.add('hidden');

      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      
      const tabEl = document.getElementById('tab-' + tabId);
      const navEl = document.getElementById('nav-' + tabId);
      if (tabEl) tabEl.classList.remove('hidden');
      if (navEl) navEl.classList.add('active');

      if (tabId === 'pronosticos') renderPronosticos();
      if (tabId === 'posiciones') renderPosiciones();
    }

    function renderPronosticos() {
      const container = document.getElementById('matchesList');
      container.innerHTML = '';
      if (state.matches.length === 0) {
        container.innerHTML = '<p style="text-align:center; font-size:0.8rem; color:#666;">No hay partidos cargados.</p>';
        return;
      }
      state.matches.forEach(m => {
        const userPred = (state.currentUser && state.users[state.currentUser]?.pronosticos[m.id]) || { l: '', v: '' };
        container.innerHTML += `
          <div class="card" style="margin-top:10px; display:flex; justify-between; align-items:center;">
            <span style="font-size:0.85rem; width:35%; text-align:right;">${m.local}</span>
            <div style="display:flex; gap:4px; align-items:center;">
              <input type="number" id="pred_l_${m.id}" value="${userPred.l}" style="width:36px; text-align:center; padding:4px;">
              <span>-</span>
              <input type="number" id="pred_v_${m.id}" value="${userPred.v}" style="width:36px; text-align:center; padding:4px;">
            </div>
            <span style="font-size:0.85rem; width:35%;">${m.visitante}</span>
          </div>
        `;
      });
    }

    function guardarPronosticos() {
      if (!state.currentUser) return alert("Debés ingresar primero.");
      state.matches.forEach(m => {
        const l = document.getElementById(`pred_l_${m.id}`).value;
        const v = document.getElementById(`pred_v_${m.id}`).value;
        if (l !== '' && v !== '') {
          state.users[state.currentUser].pronosticos[m.id] = { l: parseInt(l), v: parseInt(v) };
        }
      });
      localStorage.setItem('pm_users', JSON.stringify(state.users));
      alert("Pronósticos guardados.");
    }

    function renderPosiciones() {
      const tbody = document.getElementById('leaderboardBody');
      tbody.innerHTML = '';
      Object.entries(state.users).forEach(([u, d], i) => {
        tbody.innerHTML += `
          <tr style="border-bottom:1px solid #111;">
            <td style="padding:10px;">${i + 1}</td>
            <td style="padding:10px;">${u}</td>
            <td style="padding:10px; text-align:center; color:#39FF14;">${d.puntos || 0}</td>
          </tr>
        `;
      });
    }

    function checkAdmin() {
      if (document.getElementById('adminPassInput').value === 'admin123') {
        document.getElementById('adminAuth').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
      } else {
        alert("Clave incorrecta.");
      }
    }

    function crearPartido() {
      const local = document.getElementById('adminLocal').value.trim();
      const visitante = document.getElementById('adminVisitante').value.trim();
      if (!local || !visitante) return alert("Completa ambos equipos.");

      state.matches.push({ id: Date.now(), local, visitante, golesL: null, golesV: null });
      localStorage.setItem('pm_matches', JSON.stringify(state.matches));
      document.getElementById('adminLocal').value = '';
      document.getElementById('adminVisitante').value = '';
      alert("Partido agregado.");
    }
  </script>
</body>
</html>
