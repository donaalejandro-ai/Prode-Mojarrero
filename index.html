<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prode Mojarrero v16.0 ⚽</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    body { background-color: #050505; color: #e5e5e5; font-family: system-ui, -apple-system, sans-serif; }
    .neon-text { color: #39FF14; text-shadow: 0 0 8px rgba(57, 255, 20, 0.4); }
    .neon-btn { background-color: #39FF14; color: #000000; font-weight: bold; }
    .neon-btn:hover { background-color: #2ce00e; box-shadow: 0 0 12px rgba(57, 255, 20, 0.6); }
  </style>
</head>
<body class="pb-24">

  <!-- HEADER -->
  <header class="bg-black border-b border-[#39FF14]/30 p-4 sticky top-0 z-50 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-11 h-11 rounded-full bg-black border-2 border-[#39FF14] flex items-center justify-center overflow-hidden">
        <span class="text-xl">⚽</span>
      </div>
      <h1 class="text-xl font-extrabold tracking-wider uppercase neon-text">Prode Mojarrero</h1>
    </div>
    <div class="flex items-center space-x-2">
      <span id="userInfo" class="text-xs text-gray-400"></span>
      <button id="btnLogout" onclick="logout()" class="hidden text-[10px] bg-red-900/60 text-red-300 border border-red-700/50 px-2 py-1 rounded font-bold">Salir</button>
    </div>
  </header>

  <!-- NAVEGACIÓN -->
  <nav class="fixed bottom-0 left-0 right-0 bg-black border-t border-[#39FF14]/30 flex justify-around p-2 z-50 text-xs">
    <button onclick="switchTab('pronosticos')" class="flex flex-col items-center text-[#39FF14]"><span>⚽</span><span>Pronósticos</span></button>
    <button onclick="switchTab('posiciones')" class="flex flex-col items-center text-gray-400 hover:text-[#39FF14]"><span>🏆</span><span>Posiciones</span></button>
    <button onclick="switchTab('equipos')" class="flex flex-col items-center text-gray-400 hover:text-[#39FF14]"><span>👕</span><span>Equipos</span></button>
    <button onclick="switchTab('admin')" class="flex flex-col items-center text-gray-400 hover:text-[#39FF14]"><span>⚙️</span><span>Admin</span></button>
  </nav>

  <main class="p-4 max-w-md mx-auto">

    <!-- LOGIN / REGISTRO -->
    <section id="loginSection" class="bg-[#111] p-6 rounded-xl border border-[#39FF14]/40 my-6">
      <div class="flex border-b border-gray-800 mb-6">
        <button id="tabBtnLogin" onclick="switchAuthTab('login')" class="w-1/2 py-2 text-center font-bold text-sm text-[#39FF14] border-b-2 border-[#39FF14]">Ingresar</button>
        <button id="tabBtnRegister" onclick="switchAuthTab('register')" class="w-1/2 py-2 text-center font-bold text-sm text-gray-500 border-b-2 border-transparent">Registrarse</button>
      </div>

      <div id="authLoginForm" class="space-y-4">
        <div>
          <label class="block text-xs uppercase mb-1 text-gray-300">Usuario</label>
          <input type="text" id="loginUsernameInput" placeholder="Ej: Alejandro" class="w-full bg-black border border-gray-700 rounded p-2 text-white text-sm">
        </div>
        <div>
          <label class="block text-xs uppercase mb-1 text-gray-300">PIN (4 dígitos)</label>
          <input type="password" id="loginPinInput" maxlength="4" placeholder="••••" class="w-full bg-black border border-gray-700 rounded p-2 text-white text-sm">
        </div>
        <button type="button" onclick="handleLogin()" class="w-full py-2.5 rounded neon-btn uppercase text-sm mt-2">Entrar</button>
      </div>

      <div id="authRegisterForm" class="space-y-4 hidden">
        <div>
          <label class="block text-xs uppercase mb-1 text-gray-300">Nuevo Usuario</label>
          <input type="text" id="registerUsernameInput" placeholder="Ej: Lucas" class="w-full bg-black border border-gray-700 rounded p-2 text-white text-sm">
        </div>
        <div>
          <label class="block text-xs uppercase mb-1 text-gray-300">PIN (4 dígitos)</label>
          <input type="password" id="registerPinInput" maxlength="4" placeholder="••••" class="w-full bg-black border border-gray-700 rounded p-2 text-white text-sm">
        </div>
        <button type="button" onclick="handleRegister()" class="w-full py-2.5 rounded bg-green-600 text-white font-bold uppercase text-sm mt-2">Crear Cuenta</button>
      </div>
      <p id="authError" class="text-red-400 text-xs mt-4 text-center hidden"></p>
    </section>

    <!-- PRONÓSTICOS -->
    <section id="tab-pronosticos" class="tab-content hidden">
      <h2 class="text-md font-bold neon-text mb-1">Tus Pronósticos</h2>
      <p class="text-[11px] text-gray-400 mb-3">Cargá tus resultados y guardalos.</p>
      <div id="matchesList" class="space-y-6"></div>
      <button onclick="guardarPronosticos()" class="w-full mt-6 py-3 rounded neon-btn uppercase font-bold tracking-wider sticky bottom-16 z-40">💾 Guardar Mis Pronósticos</button>
    </section>

    <!-- POSICIONES -->
    <section id="tab-posiciones" class="tab-content hidden">
      <h2 class="text-md font-bold neon-text mb-1">Tabla General</h2>
      <div class="bg-[#111] rounded-xl border border-gray-800 overflow-hidden">
        <table class="w-full text-left text-xs">
          <thead class="bg-black text-[#39FF14] border-b border-gray-800">
            <tr>
              <th class="p-3">#</th>
              <th class="p-3">Jugador</th>
              <th class="p-3 text-center">EX</th>
              <th class="p-3 text-center">TE</th>
              <th class="p-3 text-right">Pts</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody"></tbody>
        </table>
      </div>
    </section>

    <!-- EQUIPOS -->
    <section id="tab-equipos" class="tab-content hidden">
      <h2 class="text-md font-bold neon-text mb-3">Planteles</h2>
      <div id="teamsList" class="space-y-4"></div>
    </section>

    <!-- ADMIN -->
    <section id="tab-admin" class="tab-content hidden">
      <h2 class="text-md font-bold text-red-500 mb-3">Panel Admin</h2>
      <div id="adminAuth" class="bg-[#111] p-4 rounded-xl border border-gray-800 space-y-3">
        <input type="password" id="adminPassInput" placeholder="Contraseña Admin" class="w-full bg-black border border-gray-700 rounded p-2 text-white">
        <button onclick="checkAdmin()" class="w-full py-2 bg-red-600 text-white rounded font-bold">Ingresar</button>
      </div>
      <div id="adminPanel" class="hidden space-y-6">
        <div class="bg-[#111] p-4 rounded-xl border border-gray-800 space-y-3">
          <h3 class="text-sm font-bold neon-text">Crear Equipo</h3>
          <div class="flex space-x-2">
            <input type="text" id="newTeamName" placeholder="Nombre Equipo" class="flex-1 bg-black border border-gray-700 rounded p-2 text-xs text-white">
            <button onclick="crearEquipo()" class="bg-[#39FF14] text-black font-bold px-3 py-1 rounded text-xs">Crear</button>
          </div>
        </div>
        <div class="bg-[#111] p-4 rounded-xl border border-gray-800 space-y-3">
          <h3 class="text-sm font-bold neon-text">Armar Partido</h3>
          <input type="number" id="matchRound" min="1" value="1" placeholder="Fecha N°" class="w-full bg-black border border-gray-700 rounded p-2 text-xs text-white">
          <div class="grid grid-cols-2 gap-2">
            <select id="selectLocal" class="w-full bg-black border border-gray-700 rounded p-2 text-xs text-white"></select>
            <select id="selectVisitante" class="w-full bg-black border border-gray-700 rounded p-2 text-xs text-white"></select>
          </div>
          <input type="datetime-local" id="matchDateTime" class="w-full bg-black border border-gray-700 rounded p-2 text-xs text-white">
          <button onclick="crearPartido()" class="w-full py-2 bg-[#39FF14] text-black font-bold rounded text-xs">Agregar Partido</button>
        </div>
        <div class="bg-[#111] p-4 rounded-xl border border-gray-800 space-y-3">
          <h3 class="text-sm font-bold neon-text">Cargar Resultados</h3>
          <div id="adminMatches" class="space-y-4"></div>
        </div>
      </div>
    </section>

  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDA1ja5f3OlRKkqTbE-lOc_Ou4UdZvk4nA",
      authDomain: "prode-mojarrero-d05c0.firebaseapp.com",
      projectId: "prode-mojarrero-d05c0",
      storageBucket: "prode-mojarrero-d05c0.firebasestorage.app",
      messagingSenderId: "236181626827",
      appId: "1:236181626827:web:49da5330a456d3486ca04e",
      measurementId: "G-4PZL7G8CSR"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUser = localStorage.getItem('pm_session_user') || null;
    let usersData = {};
    let matchesData = [];
    let teamsData = [];
    let predsData = {}; // usuario -> { matchId: {l, v} }

    // Sincronización en tiempo real usando colecciones independientes
    function initListeners() {
      // 1. Escuchar Usuarios
      db.collection('users').onSnapshot(snapshot => {
        usersData = {};
        snapshot.forEach(doc => { usersData[doc.id] = doc.data(); });
        renderPosiciones();
      });

      // 2. Escuchar Partidos
      db.collection('matches').onSnapshot(snapshot => {
        matchesData = [];
        snapshot.forEach(doc => { matchesData.push({ id: doc.id, ...doc.data() }); });
        renderPronosticos();
        renderAdminMatches();
        updateAdminSelects();
      });

      // 3. Escuchar Equipos
      db.collection('teams').onSnapshot(snapshot => {
        teamsData = [];
        snapshot.forEach(doc => { teamsData.push({ id: doc.id, ...doc.data() }); });
        renderEquipos();
        updateAdminSelects();
      });

      // 4. Escuchar Pronósticos
      db.collection('predictions').onSnapshot(snapshot => {
        predsData = {};
        snapshot.forEach(doc => {
          const d = doc.data();
          if (!predsData[d.user]) predsData[d.user] = {};
          predsData[d.user][d.matchId] = { l: d.l, v: d.v };
        });
        renderPronosticos();
        renderPosiciones();
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      initListeners();
      if (currentUser) {
        showLoggedInUser();
        switchTab('pronosticos');
      }
    });

    function switchAuthTab(mode) {
      if (mode === 'login') {
        document.getElementById('authLoginForm').classList.remove('hidden');
        document.getElementById('authRegisterForm').classList.add('hidden');
      } else {
        document.getElementById('authLoginForm').classList.add('hidden');
        document.getElementById('authRegisterForm').classList.remove('hidden');
      }
    }

    async function handleLogin() {
      const u = document.getElementById('loginUsernameInput').value.trim();
      const p = document.getElementById('loginPinInput').value.trim();
      const err = document.getElementById('authError');

      if (!usersData[u]) {
        err.innerText = "El usuario no existe."; err.classList.remove('hidden'); return;
      }
      if (usersData[u].pin !== p) {
        err.innerText = "PIN incorrecto."; err.classList.remove('hidden'); return;
      }

      currentUser = u;
      localStorage.setItem('pm_session_user', u);
      showLoggedInUser();
      switchTab('pronosticos');
    }

    async function handleRegister() {
      const u = document.getElementById('registerUsernameInput').value.trim();
      const p = document.getElementById('registerPinInput').value.trim();
      const err = document.getElementById('authError');

      if (!u || p.length !== 4) {
        err.innerText = "Usuario válido y PIN de 4 dígitos requeridos."; err.classList.remove('hidden'); return;
      }
      if (usersData[u]) {
        err.innerText = "El usuario ya existe."; err.classList.remove('hidden'); return;
      }

      await db.collection('users').doc(u).set({ pin: p });
      currentUser = u;
      localStorage.setItem('pm_session_user', u);
      showLoggedInUser();
      switchTab('pronosticos');
    }

    function showLoggedInUser() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('userInfo').innerText = `Jugador: ${currentUser}`;
      document.getElementById('btnLogout').classList.remove('hidden');
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem('pm_session_user');
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('userInfo').innerText = '';
      document.getElementById('btnLogout').classList.add('hidden');
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
    }

    function switchTab(tabId) {
      if (!currentUser && tabId !== 'admin') {
        document.getElementById('loginSection').classList.remove('hidden'); return;
      }
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tabId}`).classList.remove('hidden');
    }

    function renderPronosticos() {
      const container = document.getElementById('matchesList');
      container.innerHTML = '';
      if (matchesData.length === 0) {
        container.innerHTML = '<p class="text-xs text-gray-500 text-center">No hay partidos cargados.</p>';
        return;
      }

      const now = new Date();
      matchesData.forEach(m => {
        const isLocked = now >= new Date(m.fechaHora);
        const userPred = (predsData[currentUser] && predsData[currentUser][m.id]) ? predsData[currentUser][m.id] : null;
        const gl = userPred ? userPred.l : '';
        const gv = userPred ? userPred.v : '';

        container.innerHTML += `
          <div class="bg-[#111] p-3 rounded-lg border border-gray-800">
            <div class="text-[10px] text-gray-400 mb-2">📅 ${m.fechaHora.replace('T', ' ')} hs ${isLocked ? '<strong class="text-red-500">(CERRADO)</strong>' : ''}</div>
            <div class="flex items-center justify-between">
              <span class="w-1/3 text-right font-bold text-xs">${m.local}</span>
              <div class="flex items-center space-x-1">
                <input type="number" id="pred_l_${m.id}" value="${gl}" ${isLocked ? 'disabled' : ''} class="w-10 text-center bg-black border border-[#39FF14]/50 rounded p-1 text-white font-bold">
                <span class="text-xs text-gray-500">-</span>
                <input type="number" id="pred_v_${m.id}" value="${gv}" ${isLocked ? 'disabled' : ''} class="w-10 text-center bg-black border border-[#39FF14]/50 rounded p-1 text-white font-bold">
              </div>
              <span class="w-1/3 text-left font-bold text-xs">${m.visitante}</span>
            </div>
          </div>
        `;
      });
    }

    async function guardarPronosticos() {
      if (!currentUser) return;
      const now = new Date();

      for (let m of matchesData) {
        if (now < new Date(m.fechaHora)) {
          const inputL = document.getElementById(`pred_l_${m.id}`);
          const inputV = document.getElementById(`pred_v_${m.id}`);
          if (inputL && inputV && inputL.value !== '' && inputV.value !== '') {
            const predId = `${currentUser}_${m.id}`;
            await db.collection('predictions').doc(predId).set({
              user: currentUser,
              matchId: m.id,
              l: parseInt(inputL.value),
              v: parseInt(inputV.value)
            });
          }
        }
      }
      alert("¡Pronósticos guardados correctamente!");
    }

    function renderPosiciones() {
      const tbody = document.getElementById('leaderboardBody');
      tbody.innerHTML = '';

      let scores = {};
      Object.keys(usersData).forEach(u => { scores[u] = { pts: 0, ex: 0, te: 0 }; });

      matchesData.forEach(m => {
        if (m.golesL !== null && m.golesV !== null && m.golesL !== undefined && m.golesV !== undefined) {
          Object.keys(usersData).forEach(u => {
            const p = predsData[u] ? predsData[u][m.id] : null;
            if (p) {
              if (p.l === m.golesL && p.v === m.golesV) {
                scores[u].pts += 3; scores[u].ex++;
              } else if ((p.l > p.v && m.golesL > m.golesV) || (p.l < p.v && m.golesL < m.golesV) || (p.l === p.v && m.golesL === m.golesV)) {
                scores[u].pts += 1; scores[u].te++;
              }
            }
          });
        }
      });

      const sorted = Object.entries(scores).sort((a, b) => b[1].pts - a[1].pts);
      sorted.forEach(([nombre, data], idx) => {
        tbody.innerHTML += `
          <tr class="border-b border-gray-900">
            <td class="p-3 font-bold">${idx + 1}</td>
            <td class="p-3 font-bold">${nombre}</td>
            <td class="p-3 text-center text-gray-400">${data.ex}</td>
            <td class="p-3 text-center text-gray-400">${data.te}</td>
            <td class="p-3 text-right font-bold text-[#39FF14] text-sm">${data.pts}</td>
          </tr>
        `;
      });
    }

    function renderEquipos() {
      const container = document.getElementById('teamsList');
      container.innerHTML = '';
      teamsData.forEach(t => {
        container.innerHTML += `
          <div class="bg-[#111] p-4 rounded-xl border border-gray-800">
            <h3 class="text-sm font-bold text-[#39FF14]">🛡️ ${t.nombre}</h3>
          </div>
        `;
      });
    }

    function checkAdmin() {
      if (document.getElementById('adminPassInput').value === 'admin123') {
        document.getElementById('adminAuth').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
      } else { alert("Clave incorrecta."); }
    }

    async function crearEquipo() {
      const name = document.getElementById('newTeamName').value.trim();
      if (name) {
        await db.collection('teams').add({ nombre: name });
        document.getElementById('newTeamName').value = '';
      }
    }

    async function crearPartido() {
      const roundVal = document.getElementById('matchRound').value;
      const local = document.getElementById('selectLocal').value;
      const visitante = document.getElementById('selectVisitante').value;
      const fechaHora = document.getElementById('matchDateTime').value;

      if (local && visitante && fechaHora) {
        await db.collection('matches').add({
          fechaNum: parseInt(roundVal),
          local: local,
          visitante: visitante,
          fechaHora: fechaHora,
          golesL: null,
          golesV: null
        });
        alert("Partido creado");
      }
    }

    function updateAdminSelects() {
      const sL = document.getElementById('selectLocal');
      const sV = document.getElementById('selectVisitante');
      if (!sL || !sV) return;
      sL.innerHTML = ''; sV.innerHTML = '';
      teamsData.forEach(t => {
        sL.innerHTML += `<option value="${t.nombre}">${t.nombre}</option>`;
        sV.innerHTML += `<option value="${t.nombre}">${t.nombre}</option>`;
      });
    }

    function renderAdminMatches() {
      const container = document.getElementById('adminMatches');
      if (!container) return;
      container.innerHTML = '';
      matchesData.forEach(m => {
        container.innerHTML += `
          <div class="bg-black p-3 rounded border border-gray-800 flex justify-between items-center text-xs">
            <span>${m.local} vs ${m.visitante}</span>
            <div class="flex items-center space-x-1">
              <input type="number" id="admin_l_${m.id}" value="${m.golesL !== null ? m.golesL : ''}" class="w-8 bg-[#222] text-center text-white border border-gray-700 rounded">
              <span>-</span>
              <input type="number" id="admin_v_${m.id}" value="${m.golesV !== null ? m.golesV : ''}" class="w-8 bg-[#222] text-center text-white border border-gray-700 rounded">
              <button onclick="guardarResultadoAdmin('${m.id}')" class="bg-green-600 text-white px-2 py-0.5 rounded text-[10px]">Guardar</button>
            </div>
          </div>
        `;
      });
    }

    async function guardarResultadoAdmin(matchId) {
      const gl = document.getElementById(`admin_l_${matchId}`).value;
      const gv = document.getElementById(`admin_v_${matchId}`).value;
      if (gl !== '' && gv !== '') {
        await db.collection('matches').doc(matchId).update({
          golesL: parseInt(gl),
          golesV: parseInt(gv)
        });
        alert("Resultado actualizado");
      }
    }
  </script>
</body>
</html>
